---
services:
  vaultwarden:
    # Pinned: track releases deliberately - upstream API changes (register
    # rework in 1.37.4, the org-cipher encryptedByKeyId check in 1.37.4) have
    # broken this harness before. Pair with the bw CLI pinned in
    # .github/workflows/integration.yml - bw >= 2026.9 sends encryptedByKeyId
    # which 1.37.4 wrongly validates against the user key for org ciphers.
    image: vaultwarden/server:1.37.4
    container_name: vwcli-vaultwarden-test
    restart: "no"
    ports:
      - "127.0.0.1:18443:8443"
    environment:
      I_REALLY_WANT_VOLATILE_STORAGE: "true"
      ROCKET_ADDRESS: "0.0.0.0"
      ROCKET_PORT: "8443"
      ROCKET_TLS: '{certs="/ssl/cert.pem",key="/ssl/key.pem"}'
      WEB_VAULT_ENABLED: "false"
      SIGNUPS_ALLOWED: "true"
      INVITATIONS_ALLOWED: "false"
      EMERGENCY_ACCESS_ALLOWED: "false"
      SENDS_ALLOWED: "false"
      ADMIN_TOKEN: ""
    volumes:
      - ${TLS_DIR:-./.tls}:/ssl:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "https://127.0.0.1:8443/alive", "--no-check-certificate"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 3s
