name: Integration Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  integration:
    name: Vaultwarden + bw serve integration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python environment
        run: |
          wget -qO- https://astral.sh/uv/install.sh | sh
          uv sync

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Bitwarden CLI
        # Pinned: bw >= 2026.9 needs server key-id endpoints (>= 1.37.4) and
        # sends encryptedByKeyId, which 1.37.4 wrongly rejects for org ciphers.
        run: npm install -g @bitwarden/cli@2026.8.0

      - name: Run integration tests
        env:
          NODE_TLS_REJECT_UNAUTHORIZED: "0"
        run: uv run make integration-test
